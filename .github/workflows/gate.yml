name: gate

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-baseline
            os: ubuntu-latest
            rustflags: ""
            codegen_config: x86_64-baseline

          - name: linux-x64-sse4.1
            os: ubuntu-latest
            rustflags: "-C target-feature=+sse4.1"
            codegen_config: x86_64-sse41

          - name: linux-x64-avx2
            os: ubuntu-latest
            rustflags: "-C target-feature=+avx2"
            codegen_config: x86_64-avx2

          - name: linux-arm64-neon
            os: ubuntu-24.04-arm
            rustflags: "-C target-feature=+neon"
            codegen_config: aarch64-neon

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.name }}

      - name: Show Rust target info
        run: |
          rustc -Vv
          cargo -V

      - name: Verify AVX2 runner support
        if: matrix.name == 'linux-x64-avx2'
        run: |
          grep -m1 '^flags' /proc/cpuinfo
          grep -q avx2 /proc/cpuinfo

      - name: Test
        run: cargo test --locked

      - name: Test comparison tooling
        if: matrix.name == 'linux-x64-baseline'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Compare codegen with fixed baseline
        run: python3 scripts/run_codegen_comparison.py --config ${{ matrix.codegen_config }}
