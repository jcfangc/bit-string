name: release

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"

  workflow_dispatch:
    inputs:
      mode:
        description: "dryrun: cargo publish --dry-run, no official tag"
        required: true
        default: "dryrun"
        type: choice
        options: ["dryrun", "real"]
      tag_dryrun:
        description: "If true, create vX.Y.Z-dryrun.<run_id> tag in dryrun mode"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: crates-release-main
  cancel-in-progress: false

jobs:
  publish-derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Publish derive crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ "${{ inputs.mode || 'real' }}" = "dryrun" ]; then
            cargo publish --locked --dry-run --manifest-path derive/Cargo.toml
            exit 0
          fi

          derive_package="$(cargo metadata --locked --no-deps --format-version 1 --manifest-path derive/Cargo.toml \
            | python3 -c 'import json, sys; package = next(p for p in json.load(sys.stdin)["packages"] if p["manifest_path"].endswith("/derive/Cargo.toml")); print(package["name"], package["version"])')"
          read -r derive_name derive_version <<< "$derive_package"
          registry_url="https://crates.io/api/v1/crates/${derive_name}/${derive_version}"

          registry_version_available() {
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$registry_url")" = 200
          }

          if registry_version_available; then
            echo "${derive_name} ${derive_version} is already published; skipping"
          else
            cargo publish --locked --manifest-path derive/Cargo.toml
          fi

          for attempt in $(seq 1 30); do
            if registry_version_available; then
              echo "${derive_name} ${derive_version} is visible on crates.io"
              exit 0
            fi
            echo "waiting for ${derive_name} ${derive_version} to become visible (attempt ${attempt}/30)"
            sleep 5
          done

          echo "${derive_name} ${derive_version} did not become visible on crates.io" >&2
          exit 1

  release:
    needs: publish-derive
    uses: jcfangc/ci/.github/workflows/rust-crates-release.yml@v0
    with:
      mode: ${{ inputs.mode || 'real' }}
      tag_dryrun: ${{ inputs.tag_dryrun || 'false' }}
      rust_toolchain: stable
      package_manifest: Cargo.toml
      test_command: cargo test --locked
      run_tests: true
    secrets:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
