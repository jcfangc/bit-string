name: release

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"

  workflow_dispatch:
    inputs:
      mode:
        description: "dryrun: cargo publish --dry-run, no official tag"
        required: true
        default: "dryrun"
        type: choice
        options: ["dryrun", "real"]
      tag_dryrun:
        description: "If true, create vX.Y.Z-dryrun.<run_id> tag in dryrun mode"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: crates-release-main
  cancel-in-progress: false

jobs:
  publish-derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout CI scripts
        env:
          CI_REF: v0
        run: |
          rm -rf "$RUNNER_TEMP/ci"
          git clone --depth 1 --branch "$CI_REF" \
            https://github.com/jcfangc/ci \
            "$RUNNER_TEMP/ci"
          test -f "$RUNNER_TEMP/ci/.github/scripts/release/publish.py"

      - name: Test
        run: cargo test --locked

      - name: Publish derive crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          PACKAGE_MANIFEST: derive/Cargo.toml
          RELEASE_MODE: ${{ inputs.mode || 'real' }}
        run: python3 "$RUNNER_TEMP/ci/.github/scripts/release/publish.py"

  release:
    needs: publish-derive
    uses: jcfangc/ci/.github/workflows/rust-crates-release.yml@v0
    with:
      mode: ${{ inputs.mode || 'real' }}
      tag_dryrun: ${{ inputs.tag_dryrun || 'false' }}
      rust_toolchain: stable
      package_manifest: Cargo.toml
      test_command: cargo test --locked
      run_tests: true
    secrets:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
