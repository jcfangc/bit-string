[package]
name = "bit-string"
version.workspace = true
edition = "2024"
description = "A compact owned bit string type with editing, matching, and bitwise operations."
readme = "README.md"
repository = "https://github.com/jcfangc/bit-string"
license = "MIT OR Apache-2.0"
keywords = ["bitstring", "bits", "bitset", "sequence"]
categories = ["data-structures", "no-std"]
exclude = ["/benches", "/src/**/tests_for_*", "/tests", ".github/"]

[workspace]
members = ["derive"]

[workspace.package]
version = "0.6.0"

[features]
characterization = []

[workspace.dependencies]
bit-string-derive = { version = "0.6", path = "derive" }

[dependencies]
bit-string-derive.workspace = true
int-intervals = "0.1"
witnessed = "0.8.0"

[lib]
doctest = false

[dev-dependencies]
bitvec_simd = "0.20.5"
compressed-intvec = { version = "0.6.0", default-features = false }
divan = { package = "codspeed-divan-compat", version = "4.7.0" }
grit-bitvec = "0.4.3"
proptest = "1.11.0"
sux = { version = "0.14.0", default-features = false }
value-traits = "0.2.1"


